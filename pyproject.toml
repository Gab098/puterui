[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puterui"
version = "0.1.0"
description = "A lightweight terminal-based AI coding assistant powered by Ollama"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "smokey (like nagata)" },
]
keywords = ["ai", "coding-assistant", "ollama", "terminal", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typing-extensions>=4.0.0; python_version < '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
browser-playwright = [
    "playwright>=1.40.0",
]
browser-selenium = [
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
]

[project.scripts]
puterui = "puterui.cli:main"
puterui-termux = "puterui.termux_start:main"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
